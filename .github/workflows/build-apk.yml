name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest

      - name: Create www
        run: |
          mkdir -p www
          cat > www/index.html << 'HTML'
          <!DOCTYPE html><html><head>
          <meta http-equiv="refresh" content="0; url=https://kok1232.github.io/random-group/">
          <script>window.location.href='https://kok1232.github.io/random-group/';</script>
          </head><body>Loading...</body></html>
          HTML

      - name: Init Capacitor
        run: npx cap init "RandomGroup" "io.github.kok1232.randomgroup" --web-dir www

      - name: Add Android
        run: npx cap add android

      - name: Fix Kotlin conflicts
        run: |
          cd android
          cat >> build.gradle << 'EOF'
          configurations.all {
              resolutionStrategy {
                  force "org.jetbrains.kotlin:kotlin-stdlib:1.9.23"
                  force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.23"
                  force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.23"
                  force "org.jetbrains.kotlin:kotlin-stdlib-common:1.9.23"
              }
          }
          EOF

      # 1. 依照「螢幕擷取畫面 2026-06-15 123842.png」加入生成金鑰步驟
      # 調整：直接在根目錄生成，避免 cd android 後的路徑混淆
      - name: Sign AAB (Generate Keystore)
        run: |
          keytool -genkey -v -keystore release.keystore \
            -alias release -keyalg RSA -keysize 2048 -validity 10000 \
            -dbname "CN=kok1232, OU=kok1232, O=kok1232, L=TW, S=TW, C=TW" \
            -storepass android123 -keypass android123

      # 2. 修改原本的 Build AAB 步驟，帶入簽名參數
      - name: Build AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/release.keystore \
            -Pandroid.injected.signing.store.password=android123 \
            -Pandroid.injected.signing.key.alias=release \
            -Pandroid.injected.signing.key.password=android123 2>&1

      - name: Find AAB
        run: find . -name "*.aab" 2>/dev/null

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: random-group-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
          retention-days: 7