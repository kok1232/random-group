name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Init Capacitor
        run: |
          npx cap init "RandomGroup" "io.github.kok1232.randomgroup" --web-dir www
          mkdir -p www
          cp index.html www/ 2>/dev/null || echo "no index.html"

      - name: Create www/index.html with redirect
        run: |
          cat > www/index.html << 'HTML'
          <!DOCTYPE html>
          <html>
          <head>
          <meta http-equiv="refresh" content="0; url=https://kok1232.github.io/random-group/">
          <script>window.location.href='https://kok1232.github.io/random-group/';</script>
          </head>
          <body>Loading...</body>
          </html>
          HTML

      - name: Add Android platform
        run: npx cap add android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon 2>&1

      - name: Find APK
        run: find . -name "*.apk" 2>/dev/null

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: random-group-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 7
