name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 🌟 核心修正：將 Java 版本徹底升級到 21，完美解決 "invalid source release: 21" 的衝突！
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor Dependencies
        run: |
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest

      - name: Create Web Root (www)
        run: |
          mkdir -p www
          cat > www/index.html << 'HTML'
          <!DOCTYPE html><html><head>
          <meta http-equiv="refresh" content="0; url=https://kok1232.github.io/random-group/">
          <script>window.location.href='https://kok1232.github.io/random-group/';</script>
          </head><body>Loading...</body></html>
          HTML

      - name: Initialize Capacitor Config
        run: npx cap init "RandomGroup" "io.github.kok1232.randomgroup" --web-dir www

      - name: Add or Sync Android Platform
        run: |
          if [ -d "android" ]; then
            npx cap sync android
          else
            npx cap add android
          fi

      # 🌟 防彈出網頁安全鎖：確保隨機分組系統不跳出 Chrome 瀏覽器
      - name: Inject Allow Navigation Configuration
        run: |
          if [ -f "android/app/src/main/assets/capacitor.config.json" ]; then
            sed -i 's/"server": {/"server": { "allowNavigation": ["kok1232.github.io"],/g' android/app/src/main/assets/capacitor.config.json
          fi

      # 🌟 自動更新版本號：每一次點擊打包，流水版號都會自動遞增
      - name: Auto Update Android Version Code
        run: |
          sed -i 's/versionCode 1/versionCode ${{ github.run_number }}/g' android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "1.0.${{ github.run_number }}"/g' android/app/build.gradle

      # 🌟 絕對路徑金鑰現場生成：確保不管在哪個目錄打包，檔案都鎖死在最外層根目錄
      - name: Live Generate Perfect Keystore
        run: |
          rm -f ${{ github.workspace }}/release.keystore
          keytool -genkeypair -v -keystore ${{ github.workspace }}/release.keystore \
            -alias androidreleasekey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=kok1232, OU=kok1232, O=kok1232, L=TW, S=TW, C=TW" \
            -storepass stablepassword123 -keypass stablepassword123

      # 🌟 絕對路徑帶入簽章：用升級好的 Java 21 編譯器進行最完美的 AAB 封裝
      - name: Build and Sign AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/release.keystore \
            -Pandroid.injected.signing.store.password=stablepassword123 \
            -Pandroid.injected.signing.key.alias=androidreleasekey \
            -Pandroid.injected.signing.key.password=stablepassword123 2>&1

      - name: Upload Finished Artifact
        uses: actions/upload-artifact@v4
        with:
          name: random-group-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 7
