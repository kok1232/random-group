name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor Dependencies
        run: |
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest

      - name: Create Web Root (www)
        run: |
          mkdir -p www
          cat > www/index.html << 'HTML'
          <!DOCTYPE html><html><head>
          <meta http-equiv="refresh" content="0; url=https://kok1232.github.io/random-group/">
          <script>window.location.href='https://kok1232.github.io/random-group/';</script>
          </head><body>Loading...</body></html>
          HTML

      - name: Initialize Capacitor Config
        run: npx cap init "RandomGroup" "io.github.kok1232.randomgroup" --web-dir www

      - name: Add or Sync Android Platform
        run: |
          if [ -d "android" ]; then
            npx cap sync android
          else
            npx cap add android
          fi

      # 🌟 防彈出網頁安全鎖：強制將內嵌跳轉網址寫入 Android 設定，確保隨機分組系統不跳出 Chrome 瀏覽器
      - name: Inject Allow Navigation Configuration
        run: |
          if [ -f "android/app/src/main/assets/capacitor.config.json" ]; then
            sed -i 's/"server": {/"server": { "allowNavigation": ["kok1232.github.io"],/g' android/app/src/main/assets/capacitor.config.json
          fi

      # 🌟 自動更新版本號：每一次點擊打包，流水版號都會自動遞增，絕對不會重複
      - name: Auto Update Android Version Code
        run: |
          sed -i 's/versionCode 1/versionCode ${{ github.run_number }}/g' android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "1.0.${{ github.run_number }}"/g' android/app/build.gradle

      # 🌟 核心步驟：完全跳過出錯的 Base64 轉換，直接讀取剛才上傳的完好二進位憑證進行 AAB 封裝
      - name: Build and Sign AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/release.keystore \
            -Pandroid.injected.signing.store.password=stablepassword123 \
            -Pandroid.injected.signing.key.alias=androidreleasekey \
            -Pandroid.injected.signing.key.password=stablepassword123 2>&1

      - name: Upload Finished Artifact
        uses: actions/upload-artifact@v4
        with:
          name: random-group-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 7
