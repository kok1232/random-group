name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Setup Bubblewrap config
        run: |
          mkdir -p ~/.bubblewrap
          JH=$(dirname $(dirname $(readlink -f $(which java))))
          AS=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}
          echo "{\"jdkPath\":\"$JH\",\"androidSdkPath\":\"$AS\"}" > ~/.bubblewrap/config.json

      - name: Init Bubblewrap
        run: |
          mkdir -p bubblewrap-project
          cd bubblewrap-project
          printf 'n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n' | bubblewrap init --manifest https://kok1232.github.io/random-group/manifest.json --skipPwaValidation 2>&1

      - name: List project files
        run: |
          echo "=== bubblewrap-project ==="
          ls -la bubblewrap-project/ || echo "empty"

      - name: Build with Gradle
        run: |
          cd bubblewrap-project
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleRelease --no-daemon 2>&1
          else
            echo "No gradlew - init failed"
            exit 1
          fi

      - name: Find outputs
        run: find . -name "*.apk" -o -name "*.aab" 2>/dev/null || echo "none"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: random-group-apk
          path: |
            **/*.apk
            **/*.aab
          if-no-files-found: warn
          retention-days: 7
