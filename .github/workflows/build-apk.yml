name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    # 預先啟用 Node 24 支援，消除 GitHub 於 2026-06-16 起的棄用警告
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest

      - name: Create www
        run: |
          mkdir -p www
          cat > www/index.html << 'HTML'
          <!DOCTYPE html><html><head>
          <meta http-equiv="refresh" content="0; url=https://kok1232.github.io/random-group/">
          <script>window.location.href='https://kok1232.github.io/random-group/';</script>
          </head><body>Loading...</body></html>
          HTML

      - name: Init Capacitor
        run: npx cap init "RandomGroup" "io.github.kok1232.randomgroup" --web-dir www

      - name: Add Android
        run: npx cap add android

      # 🌟【新增這一段】自動將版本代號升級為 2，並將顯示版號改為 1.0.1
      - name: Update App Version
        run: |
          sed -i 's/versionCode 1/versionCode 2/g' android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "1.0.1"/g' android/app/build.gradle

      - name: Fix Kotlin conflicts
        run: |
          cd android
          cat >> build.gradle << 'EOF'
          configurations.all {
              resolutionStrategy {
                  force "org.jetbrains.kotlin:kotlin-stdlib:1.9.23"
                  force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.23"
                  force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.23"
                  force "org.jetbrains.kotlin:kotlin-stdlib-common:1.9.23"
              }
          }
          EOF

      # 修正點：將原本錯誤的 -dbname 修改為正確的 -dname
      - name: Sign AAB (Generate Keystore)
        run: |
          keytool -genkey -v -keystore release.keystore \
            -alias release -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=kok1232, OU=kok1232, O=kok1232, L=TW, S=TW, C=TW" \
            -storepass android123 -keypass android123

      # 自動帶入剛生成的臨時憑證進行 AAB 封裝與簽名
      - name: Build AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/release.keystore \
            -Pandroid.injected.signing.store.password=android123 \
            -Pandroid.injected.signing.key.alias=release \
            -Pandroid.injected.signing.key.password=android123 2>&1

      - name: Find AAB
        run: find . -name "*.aab" 2>/dev/null

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: random-group-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
          retention-days: 7
