          6fdd01000214b7ad7e05a7bd2a7f6bfbe96defdf3767fcb824f0
          EOF
          xxd -r -p keystore.hex > ${{ github.workspace }}/release.keystore

      # 🌟 直接讀取還原好的完美二進位憑證進行 AAB 封裝
      - name: Build and Sign AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/release.keystore \
            -Pandroid.injected.signing.store.password=stablepassword123 \
            -Pandroid.injected.signing.key.alias=androidreleasekey \
            -Pandroid.injected.signing.key.password=stablepassword123 2>&1

      - name: Upload Finished Artifact
        uses: actions/upload-artifact@v4
        with:
          name: random-group-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 7
