name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Setup config and manifest
        run: |
          mkdir -p ~/.bubblewrap bubblewrap-project
          JH=$(dirname $(dirname $(readlink -f $(which java))))
          AS=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}
          echo "{\"jdkPath\":\"$JH\",\"androidSdkPath\":\"$AS\"}" > ~/.bubblewrap/config.json
          python3 -c "
          import json
          m = {
            'packageId': 'io.github.kok1232.twa',
            'host': 'kok1232.github.io',
            'name': 'random-group',
            'launcherName': 'random-group',
            'display': 'standalone',
            'themeColor': '#0d0f18',
            'navigationColor': '#0d0f18',
            'navigationColorDark': '#0d0f18',
            'navigationDividerColor': '#0d0f18',
            'navigationDividerColorDark': '#0d0f18',
            'backgroundColor': '#0d0f18',
            'enableNotifications': False,
            'startUrl': '/random-group/',
            'iconUrl': 'https://kok1232.github.io/random-group/icons/icon-512.png',
            'maskableIconUrl': 'https://kok1232.github.io/random-group/icons/icon-512.png',
            'monochromeIconUrl': 'https://kok1232.github.io/random-group/icons/icon-512.png',
            'shortcuts': [],
            'generatorApp': 'bubblewrap-cli',
            'webManifestUrl': 'https://kok1232.github.io/random-group/manifest.json',
            'isChromeOSOnly': False,
            'isMetaQuest': False,
            'fullScopeUrl': 'https://kok1232.github.io/random-group/',
            'minSdkVersion': 19,
            'orientation': 'portrait',
            'fingerprints': [],
            'signing': {
              'outputFilename': 'random-group.apk',
              'alias': 'android',
              'fullName': 'kok1232',
              'organization': 'kok1232',
              'organizationalUnit': 'kok1232',
              'countryCode': 'TW',
              'keystore': 'android.keystore'
            },
            'appVersionName': '1.0.0',
            'appVersionCode': 1,
            'signingMode': 'none',
            'enableSiteSettingsShortcut': True,
            'additionalTrustedOrigins': [],
            'retainedBundles': [],
            'fallbackType': 'customtabs'
          }
          json.dump(m, open('bubblewrap-project/twa-manifest.json','w'), indent=2)
          print('manifest written')
          "

      - name: Build
        run: |
          cd bubblewrap-project
          echo "n" | bubblewrap build --skipPwaValidation || true
          [ -f gradlew ] && chmod +x gradlew && ./gradlew assembleRelease --no-daemon || true

      - name: Find outputs
        run: find . -name "*.apk" -o -name "*.aab" 2>/dev/null || echo "none"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: random-group-apk
          path: |
            **/*.apk
            **/*.aab
          if-no-files-found: warn
          retention-days: 7
