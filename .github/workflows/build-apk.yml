name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest

      - name: Create www
        run: |
          mkdir -p www
          cat > www/index.html << 'HTML'
          <!DOCTYPE html><html><head>
          <meta http-equiv="refresh" content="0; url=https://kok1232.github.io/random-group/">
          <script>window.location.href='https://kok1232.github.io/random-group/';</script>
          </head><body>Loading...</body></html>
          HTML

      - name: Init Capacitor
        run: npx cap init "RandomGroup" "io.github.kok1232.randomgroup" --web-dir www

      - name: Add Android
        run: |
          if [ -d "android" ]; then
            npx cap sync android
          else
            npx cap add android
          fi

      # 🌟 核心修正 1：直接在編譯前，強制把「不彈出瀏覽器」的信任網址注入到 Android 設定中
      - name: Inject Allow Navigation Config
        run: |
          if [ -f "android/app/src/main/assets/capacitor.config.json" ]; then
            sed -i 's/"server": {/"server": { "allowNavigation": ["kok1232.github.io"],/g' android/app/src/main/assets/capacitor.config.json
          fi

      # 🌟 自動將版本代號更新（避免 Google Play 版號重複）
      - name: Auto Update Version Code
        run: |
          sed -i 's/versionCode 1/versionCode ${{ github.run_number }}/g' android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "1.0.${{ github.run_number }}"/g' android/app/build.gradle

      # 🌟 核心修正 2：用精靈指令直接在雲端把 Base64 还原成「真正的二進位金鑰」，100% 對齊 Google 要求的指紋 D6:A1:74...
      - name: Decode Binary Keystore
        run: |
          echo "" | base64 -d > release.keystore

      # 🌟 用還原好的正確二進位金鑰進行打包
      - name: Build AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/release.keystore \
            -Pandroid.injected.signing.store.password=stablepassword123 \
            -Pandroid.injected.signing.key.alias=androidreleasekey \
            -Pandroid.injected.signing.key.password=stablepassword123 2>&1

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: random-group-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 7
